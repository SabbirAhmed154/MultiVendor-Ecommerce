<!DOCTYPE html>
<html>

<head>
    <title>Customer Registration</title>
</head>

<body>

<h1>
    Customer Registration
</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Register as Customer
    </button>

</form>


<p>
    Already have an account?

    <a href="{% url 'login' %}">
        Login
    </a>
</p>

</body>

</html>
