<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

<h1>Login</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>

</form>


<p>
    New Customer?
    <a href="{% url 'customer_register' %}">
        Register Here
    </a>
</p>


<p>
    Become a Seller?
    <a href="{% url 'seller_register' %}">
        Seller Registration
    </a>
</p>

</body>

</html>
