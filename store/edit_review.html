<!DOCTYPE html>
<html>
<head>
    <title>Edit Review</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <h2>Edit Review</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Rating</label>
            {{ form.rating }}
        </div>

        <div class="mb-3">
            <label>Review</label>
            {{ form.comment }}
        </div>

        <button
            type="submit"
            class="btn btn-primary">
            Update Review
        </button>

        <a
            href="{% url 'product_detail' review.product.id %}"
            class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
