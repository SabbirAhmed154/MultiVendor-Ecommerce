<!DOCTYPE html>
<html>
<head>

    <title>Add Variant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card p-4">

        <h2>Add Variant</h2>

        <h5>
            Product: {{ product.name }}
        </h5>

        <hr>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Color</label>
                {{ form.color }}
            </div>

            <div class="mb-3">
                <label>Size</label>
                {{ form.size }}
            </div>

            <div class="mb-3">
                <label>Storage</label>
                {{ form.storage }}
            </div>

            <div class="mb-3">
                <label>Price</label>
                {{ form.price }}
            </div>

            <div class="mb-3">
                <label>Stock</label>
                {{ form.stock }}
            </div>

            <button
                type="submit"
                class="btn btn-success">

                Save Variant

            </button>

            <a
                href="{% url 'seller_product_list' %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
