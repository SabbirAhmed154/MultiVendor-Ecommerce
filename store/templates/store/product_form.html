<!DOCTYPE html>
<html>

<head>

    <title>{{ title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

<div class="container mt-5">

    <div
        class="card shadow p-4 mx-auto"
        style="max-width: 700px;"
    >

        <h2 class="mb-4">
            {{ title }}
        </h2>


        <form
            method="post"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            {{ form.as_p }}


            <button
                type="submit"
                class="btn btn-primary"
            >

                Save Product

            </button>


            <a
                href="{% url 'seller_product_list' %}"
                class="btn btn-secondary"
            >

                Cancel

            </a>

        </form>

    </div>

</div>

</body>

</html>
