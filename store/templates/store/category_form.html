<!DOCTYPE html>
<html>

<head>

    <title>Add Category</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

<div class="container mt-5">

    <div
        class="card shadow p-4 mx-auto"
        style="max-width: 600px;"
    >

        <h2>
            Add Category
        </h2>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}


            <button
                class="btn btn-primary"
                type="submit"
            >

                Add Category

            </button>

        </form>

    </div>

</div>

</body>

</html>
